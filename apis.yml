apis:
- aid: knative:knative-functions
  name: Knative Functions
  description: >-
    Knative Functions enables developers to create, build, and deploy stateless, event-driven functions
    as Knative Services using the func CLI or the kn func plugin. Functions can be written in multiple
    languages and are automatically deployed as auto-scaling Knative Services that respond to HTTP requests
    or CloudEvents.
  humanURL: https://knative.dev/docs/functions/
  properties:
  - type: Documentation
    url: https://knative.dev/docs/functions/
  - type: GettingStarted
    url: https://knative.dev/docs/getting-started/about-knative-functions/
  - type: GitHubRepository
    url: https://github.com/knative/func
  tags:
  - CLI
  - Event-Driven
  - Functions
  - Serverless
- aid: knative:knative-cli
  name: Knative CLI (kn)
  description: >-
    The Knative CLI (kn) provides a command-line interface for creating and managing Knative resources
    including Services, Revisions, Routes, event sources, and Brokers. It simplifies tasks like traffic
    splitting and autoscaling configuration without requiring direct YAML editing.
  humanURL: https://knative.dev/docs/client/
