aid: knative
name: Knative
description: >-
  Knative is a CNCF graduated platform that extends Kubernetes to provide serverless capabilities. It consists of
  Serving for deploying and scaling serverless workloads with automatic scale-to-zero, and Eventing for building
  event-driven architectures with declarative event routing and delivery. Knative abstracts away infrastructure
  complexity so developers can focus on writing code.
url: https://knative.dev
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/knative.png
tags:
